<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ReyStudio: Artikel Bebas</title>
  <script>
    (function(){
      var t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="untold-story.css"/>
</head>
<body>

  <header class="us-header">
    <div class="us-header-inner">
      <a href="index.html" class="us-back">
        <span>Rey Studio</span>
      </a>
      <span class="us-header-title">Artikel Bebas</span>
      <button class="us-theme-toggle" id="us-theme-toggle" aria-label="Toggle dark mode">
        <i class="bi bi-moon-stars"></i>
      </button>
    </div>
  </header>

  <main class="us-main" id="us-main">
    <aside class="us-sidebar" id="us-sidebar">
      <div class="us-sidebar-inner" id="us-story-list"></div>
    </aside>
    <article class="us-content" id="us-content">
      <div class="us-content-inner" id="us-story-body"></div>
    </article>
  </main>

  <script src="untold-story.js"></script>
</body>
</html>
